<template>
	<lightning-input
		class="date-input"
		type="date"
		label={label}
		value={value}
		min={minimumDate}
		required={isRequired}

		oninput={handleChange}
		onchange={handleChange}
		onblur={handleChange}>
	</lightning-input>
</template>
