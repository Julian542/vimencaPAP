<template>
	<lightning-card class="actionsCard">
		<template if:true={showSpinner}>
			<lightning-spinner alternative-text="Procesando"></lightning-spinner>
		</template>

		<div class="cardTitle">Acciones disponibles</div>

		<template if:true={clasificacionMIPYMESInvalida}>
			<div class="validationMessage">
				<div
					class="banner error"
					role="alert">
					<span class="icon">⛔</span>
					<span class="text">{mensajeClasificacionMIPYMESInvalida}</span>
				</div>
			</div>
		</template>

		<template if:true={clasificacionMIPYMESError}>
			<div class="validationMessage">
				<div
					class="banner error"
					role="alert">
					<span class="icon">⛔</span>
					<span class="text">{clasificacionMIPYMESError}</span>
				</div>
			</div>
		</template>

		<div class={containerClass}>
			<div class="messagesSection">
				<template if:true={showResponsableManual}>
					<div class="banner warning">
						<span class="text">Responsable de {contextoManual.etapa}: <strong>{responsableManual}</strong></span>
					</div>
				</template>
				<template if:true={showEnviarDocumentacionContratos}>
					<div class="banner warning">
						<span class="text"
							>Debe cargar documentación para confección de contrato en pestaña Checklist de Documentos, luego presionar el botón para
							enviar a revisión.</span
						>
					</div>
				</template>
				<template if:true={showRevisionDocumentacionContratos}>
					<div class="banner warning">
						<span class="text"
							>Debe aprobar todos los documentos de la categoría Documentos para confección de contrato en la pestaña Checklist de
							Documentos para habilitar la generación.</span
						>
					</div>
				</template>
				<template if:true={showPedidoDocumentacionContratos}>
					<div class="banner warning">
						<div class="text">
							<strong>Pedido de documentación extra</strong>
							<lightning-formatted-text value={pedidoDocumentacionContratos}></lightning-formatted-text>
							<p>
								Para completar o corregir documentos del checklist, utilice esa pestaña. La documentación adicional que no corresponda
								al checklist debe cargarse en Relacionados &gt; Archivos.
							</p>
						</div>
					</div>
				</template>
				<template if:true={showErrorDocumentacionContratos}>
					<div
						class="banner error"
						role="alert">
						<span class="text">No se pudo consultar la documentación para contratos. Actualice la página para reintentar.</span>
					</div>
				</template>
				<!-- BLOQUE NUEVO: Proceso de aprobación activo -->
				<template if:true={showApprovalSection}>
					<template if:true={showActiveApprovalBanner}>
						<div class="banner warning">
							<span class="icon">⚠️</span>
							<span class="text">
								Hay un proceso de verificación activo
								<template if:true={currentApproverName}> &nbsp;asignado a: <strong>{currentApproverName}</strong> </template>
							</span>
						</div>
					</template>

					<template if:true={showMensajeValidacionAbanks}>
						<div class="banner warning">
							<span class="icon">⚠️</span>
							<span class="text">
								Por favor, validar que el crédito se haya creado correctamente en el core de Abanks y presionar el botón Validado solo
								si todo está correcto, también puede volver a enviar la creación del crédito a Abanks.
							</span>
						</div>
					</template>

					<template if:true={showAnalystValidationStage}>
						<div class="banner warning">
							<span class="icon">⚠️</span>
							<span class="text">
								Debe validar la documentación en pestaña Checklist de Documentos, luego podrá Recomendar o Enviar a Supervisor la
								solicitud si lo desea.
							</span>
						</div>
					</template>

					<template if:true={showApproveRejectButtons}>
						<div class="banner warning">
							<span class="icon">⚠️</span>
							<span class="text">Puede {mensajeParaAprobar} o {rejectButtonLabel} la solicitud actual.</span>
						</div>
					</template>

					<template if:true={showEdicionDocumentosAnalisis}>
						<div class="banner warning">
							<span class="icon">✏️</span>
							<span class="text">{mensajeEdicionDocumentosAnalisis}</span>
						</div>
					</template>

					<template if:true={showReassignButton}>
						<div class="banner warning">
							<span class="icon">⚠️</span>
							<span class="text">Como administrador puede reasignar el proceso de aprobación actual.</span>
						</div>
					</template>
				</template>

				<!-- Enviar a archivo y custodia de valores -->
				<template if:true={showEnviarAArchivoYCustodia}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Documentación post desembolso incompleta.</span>
					</div>
				</template>

				<!-- Enviar a firmar -->
				<template if:true={showEnviarAFirmar}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Pendiente gestionar firmas.</span>
					</div>
				</template>

				<template if:true={showConsultarEstadoFirma}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text"
							>Puede consultar el estado de firma de los documentos enviados, si dicho botón sigue apareciendo significa que el cliente
							aún no firma todos los documentos requeridos.</span
						>
					</div>
				</template>

				<template if:true={showPreguntaFormalizacion}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">¿Desembolsar sin registrar garantía?</span>
					</div>
				</template>

				<template if:true={showFormalizarGarantiasPendientes}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">
							Hay {formalizacionContext.cantidadPendientes} garantía(s) pendiente(s) de formalización. La solicitud no podrá cerrarse.
						</span>
					</div>
				</template>

				<!-- Doc desembolso -->
				<template if:true={showDocDesembolso}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">
							Debe cargar documentación para desembolso en pestaña Checklist de Documentos, luego presionar el botón para enviar a
							revisión.
						</span>
					</div>
				</template>

				<!-- Cliente acepta condición -->
				<template if:true={showClienteAceptaCondicion}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">¿Cliente acepta condición?</span>
					</div>
				</template>

				<!-- Solicitar excepción buró -->
				<template if:true={showSolicitarExcepcionBuro}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Aplica excepción de buró.</span>
					</div>
				</template>

				<!-- Recepción Documentos -->
				<template if:true={showRecepcionDocs}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">
							Debe cargar documentación para análisis en pestaña Checklist de Documentos, luego presionar el botón para enviar a
							revisión.
						</span>
					</div>
				</template>

				<!-- Reintentar Listas -->
				<template if:true={showReintentarListas}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">{mensajeValidacionListas}</span>
					</div>
				</template>

				<!-- Reintentar Buró -->
				<template if:true={showReintentarBuro}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Validación de buró pendiente.</span>
					</div>
				</template>

				<template if:true={showErrorAPIPrestamos}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">No se pudo crear el crédito en ABANKS</span>
					</div>
				</template>

				<template if:true={showErrorAPIDesembolso}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Falló la conexión con el servicio de desembolso</span>
					</div>
				</template>

				<!-- Planilla desembolso -->
				<template if:true={showGestionPlanillaAssignedBanner}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text"> Hay un proceso de verificación activo asignado a: <strong>{usuarioGestionPlanillaName}</strong> </span>
					</div>
				</template>

				<template if:true={showPagaresAssignedBanner}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text"> Hay un proceso de verificación activo asignado a: <strong>{usuarioPagaresYContratosName}</strong> </span>
					</div>
				</template>

				<template if:true={showPlanillaDesembolso}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Pendiente completar planilla de desembolso.</span>
					</div>
				</template>

				<template if:true={showCreadoEnAbanks}>
					<div class="banner warning">
						<span class="icon">&#9888;&#65039;</span>
						<span class="text">Debe crear el crédito, seguro y garantías en core de Abanks, cuando esté listo, presionar botón.</span>
					</div>
				</template>

				<template if:true={showDesembolsado}>
					<div class="banner warning">
						<span class="icon">&#9888;&#65039;</span>
						<span class="text">Debe desembolsar el crédito en core de Abanks, cuando esté listo, presionar botón.</span>
					</div>
				</template>

				<template if:true={showCompletarInformacion}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Aprobado por PLA, puede continuar completando solicitud de crédito.</span>
					</div>
				</template>

				<!-- Devolver a Oficial de Negocio -->
				<template if:true={showDevolverAOficial}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Puede devolver la solicitud al Oficial de negocio.</span>
					</div>
				</template>

				<template if:true={showEnviarRevisionSupervisor}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Puede enviar la solicitud a revisión a Supervisor.</span>
					</div>
				</template>

				<template if:true={showGenerarPagareMessage}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text"
							>Debe completar los campos "Acto número pagaré" y "Número de folio pagaré" en la sección "Datos del crédito" para generar
							el pagaré.</span
						>
					</div>
				</template>

				<!-- Aprobar con condición -->
				<template if:true={showAccionesComite}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Puede aprobar con condición.</span>
					</div>
				</template>

				<template if:true={showSolicitarExcepcionCredito}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Puede solicitar una excepción de crédito antes de continuar el análisis.</span>
					</div>
				</template>

				<template if:true={showAccionesAprobacionExcepcion}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">Tiene una excepción de crédito pendiente de decisión.</span>
					</div>
				</template>

				<template if:true={showRespuestaCondicionExcepcion}>
					<div class="banner warning">
						<span class="icon">⚠️</span>
						<span class="text">La excepción fue aprobada con condición. Registre la respuesta del cliente.</span>
					</div>
				</template>

				<!-- Sin acciones -->
				<template if:true={showEmpty}>
					<div class="banner success">
						<span class="icon">✅</span>
						<span class="text">Sin acciones disponibles</span>
					</div>
				</template>
			</div>

			<template if:false={showEmpty}>
				<div class="buttonsSection">
					<template if:true={showReasignarManual}>
						<div class="btnRow center">
							<lightning-button
								label="Reasignar"
								onclick={handleReasignarManual}
								disabled={loading}></lightning-button>
						</div>
					</template>

					<template if:true={showEnviarDocumentacionContratos}>
						<div class="btnRow center">
							<lightning-button
								variant="brand"
								label="Documentación para contratos cargada, enviar a revisión"
								onclick={handleEnviarDocumentacionContratos}
								disabled={loading}></lightning-button>
						</div>
					</template>

					<template if:true={showSolicitarExcepcionCredito}>
						<div class="btnRow center">
							<lightning-button
								variant="brand"
								label="Solicitar excepción"
								onclick={openModalSolicitarExcepcionCredito}>
							</lightning-button>
						</div>
					</template>

					<template if:true={showAccionesAprobacionExcepcion}>
						<div class="btnRow center">
							<lightning-button
								variant="brand"
								label="Aprobar"
								onclick={handleAprobarExcepcionCredito}>
							</lightning-button>
							<lightning-button
								variant="neutral"
								label="Aprobar con condición"
								onclick={openModalCondicionExcepcion}>
							</lightning-button>
							<lightning-button
								variant="destructive"
								label="Rechazar excepción"
								onclick={openModalRechazoExcepcion}>
							</lightning-button>
						</div>
					</template>

					<template if:true={showRespuestaCondicionExcepcion}>
						<div class="btnRow center">
							<lightning-button
								variant="brand"
								label="Cliente aprueba condición"
								onclick={handleClienteApruebaCondicionExcepcion}>
							</lightning-button>
							<lightning-button
								variant="destructive"
								label="Cliente no aprueba condición"
								onclick={handleClienteNoApruebaCondicionExcepcion}>
							</lightning-button>
						</div>
					</template>

					<template if:false={excepcionBloqueaAccionesOrdinarias}>
						<template if:true={showEdicionDocumentosAnalisis}>
							<div class="btnRow center">
								<lightning-button
									variant="neutral"
									label="Editar informe de crédito"
									onclick={openModalEditarInformeCredito}>
								</lightning-button>

								<template if:true={showBotonEditarCapacidadPago}>
									<lightning-button
										variant="neutral"
										label="Editar capacidad de pago"
										onclick={openModalEditarCapacidadPago}>
									</lightning-button>
								</template>
							</div>
						</template>

						<template if:true={showValidacionAbanks}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Validado"
									onclick={handleValidarCreacionAbanks}>
								</lightning-button>

								<lightning-button
									variant="neutral"
									label="Volver a intentar creación"
									onclick={handleReintentarAPIPrestamos}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showAnalystValidationStage}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Validado"
									onclick={handleValidarDocumentacionAnalista}>
								</lightning-button>

								<lightning-button
									variant="neutral"
									label="Devolver a Oficial de Negocio"
									onclick={openModalDevolver}>
								</lightning-button>

								<lightning-button
									variant="destructive"
									label="Desestimar"
									onclick={openModalRechazo}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showApproveRejectButtons}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label={approveButtonLabel}
									onclick={openModalAprobacion}>
								</lightning-button>

								<lightning-button
									variant="destructive"
									label={rejectButtonLabel}
									onclick={openModalRechazo}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showReassignButton}>
							<div class="btnRow center">
								<lightning-button
									variant="neutral"
									label="Reasignar"
									onclick={openModalReasignar}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showEnviarAArchivoYCustodia}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Enviar a archivo y custodia de valores"
									onclick={handleEnviarAArchivoYCustodia}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showEnviarAFirmar}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Enviar a firmar"
									onclick={handleEnviarAFirmar}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showConsultarEstadoFirma}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Validar firmas"
									onclick={handleConsultarEstadoFirma}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showPreguntaFormalizacion}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Sí"
									onclick={handleDesembolsarSinRegistrarGarantias}>
								</lightning-button>
								<lightning-button
									variant="neutral"
									label="No"
									onclick={openModalFormalizacionGarantias}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showFormalizarGarantiasPendientes}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Formalizar garantías"
									onclick={openModalFormalizacionGarantias}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showDocDesembolso}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Documentación de desembolso cargada, enviar a revisión"
									onclick={handleDocDesembolsoCargadaEnviarRevision}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showClienteAceptaCondicion}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Acepta"
									onclick={handleAceptaCondicion}>
								</lightning-button>

								<lightning-button
									variant="destructive"
									label="No acepta"
									onclick={handleNoAceptaCondicion}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showSolicitarExcepcionBuro}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Solicitar excepción buró"
									onclick={handleSolicitarExcepcionBuro}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showRecepcionDocs}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Documentación cargada, enviar a revisión"
									onclick={handleDocCargadaEnviarRevision}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showReintentarListas}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Reintentar servicio validar listas"
									onclick={handleReintentarListas}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showReintentarBuro}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Reintentar buró de crédito"
									onclick={handleReintentarBuro}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showErrorAPIPrestamos}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Reintentar"
									onclick={handleReintentarAPIPrestamos}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showErrorAPIDesembolso}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Reintentar"
									onclick={handleReintentarAPIDesembolso}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showPlanillaDesembolso}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Completar planilla de desembolso"
									onclick={handlePlanillaDesembolso}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showCreadoEnAbanks}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Creado en Abanks"
									onclick={handleMarcarCreadoEnAbanks}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showDesembolsado}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Desembolsado"
									onclick={handleMarcarDesembolsado}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showCompletarInformacion}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Completar información"
									onclick={handleCompletarInformacion}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showEnviarRevisionSupervisor}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Enviar a revisión a Supervisor"
									onclick={handleEnviarRevisionSupervisor}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showGenerarPagareButton}>
							<div class="btnRow center">
								<lightning-button
									variant="brand"
									label="Generar pagarés y contratos"
									onclick={handleGenerarPagare}
									disabled={disableGenerarPagareButton}>
								</lightning-button>
							</div>
						</template>

						<template if:true={showSolicitarDocumentacionContratos}>
							<div class="btnRow center">

							for:item="seccion">
							<div
								key={seccion.titulo}
								class="slds-m-bottom_large">
								<h4 class="slds-text-title_bold slds-m-bottom_small">{seccion.titulo}</h4>
								<div class="slds-grid slds-wrap slds-gutters_small">
									<template
										for:each={seccion.campos}
										for:item="campo">
										<div
											key={campo.clave}
											class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
											<lightning-input
												if:true={campo.esTexto}
												type="text"
												data-clave={campo.clave}
												label={campo.etiqueta}
												value={campo.valor}
												onchange={handleDatoContratoChange}
												required={campo.requerido}></lightning-input>
											<lightning-textarea
												if:true={campo.esAreaTexto}
												data-clave={campo.clave}
												label={campo.etiqueta}
												value={campo.valor}
												onchange={handleDatoContratoChange}
												required={campo.requerido}></lightning-textarea>
											<lightning-input
												if:true={campo.esFecha}
												type="date"
												data-clave={campo.clave}
												label={campo.etiqueta}
												value={campo.valor}
												max={campo.fechaMaxima}
												message-when-range-overflow={campo.mensajeFechaFueraRango}
												onchange={handleDatoContratoChange}
												required={campo.requerido}></lightning-input>
											<lightning-input
												if:true={campo.esNumero}
												type="number"
												step={campo.paso}
												min={campo.minimo}
												data-clave={campo.clave}
												label={campo.etiqueta}
												value={campo.valor}
												onchange={handleDatoContratoChange}
												required={campo.requerido}></lightning-input>
											<lightning-combobox
												if:true={campo.esLista}
												data-clave={campo.clave}
												label={campo.etiqueta}
												value={campo.valor}
												options={campo.opciones}
												onchange={handleDatoContratoChange}
												disabled={campo.deshabilitado}
												required={campo.requerido}></lightning-combobox>
										</div>
									</template>
								</div>
							</div>
						</template>
					</template>
				</div>

				<footer class="slds-modal__footer">
					<lightning-button
						variant="neutral"
						label="Cancelar"
						onclick={closeModalDatosPagare}>
					</lightning-button>
					<lightning-button
						variant="brand"
						label={etiquetaBotonGeneracion}

				</footer>
			</div>

									label="Garantía constituida"
									options={formalizacionSiNoOptions}

	<template if:true={showModalCondiciones}>

			role="dialog"

				</header>

				<div class="slds-modal__content slds-p-around_medium">
					<lightning-input
						type="number"
						label="Monto"
						value={monto}
						disabled></lightning-input>
					<lightning-input
						type="number"
						label="Plazo (meses)"
						value={plazoMeses}
						disabled></lightning-input>
					<lightning-input
						type="number"
						label="Tasa de interés"
						value={tasaInteres}
						disabled></lightning-input>

					<div class="slds-m-top_medium"></div>

					<lightning-input
						type="number"
						label="Monto aprobado"
						value={montoAprobado}
						onchange={handleMontoAprobadoChange}
						required>
					</lightning-input>

					<lightning-input
						type="number"
						label="Plazo meses aprobado"
						field-level-help={approvedLoanTermOverflowMessage}
						data-approved-loan-term
						value={plazoAprobado}
						onchange={handlePlazoAprobadoChange}
						step="1"
						max={maxApprovedLoanTermMonths}
						message-when-range-overflow={approvedLoanTermOverflowMessage}

					</lightning-input>

						<div class="slds-text-color_error slds-m-top_x-small" role="alert">{approvedLoanTermPolicyMessage}</div>
					</template>

					<lightning-input
						type="text"
						label="Tasa interés aprobada (%)"
						value={tasaAprobada}
						onchange={handleTasaAprobadaChange}
						oninput={handleTasaAprobadaChange}
						inputmode="decimal"
						pattern="[0-9]{0,2}(\.[0-9]{0,2})?"
						required>
					</lightning-input>

					<lightning-textarea
						label="Otras condiciones"
						value={otrasCondicionesComite}
						onchange={handleOtrasCondicionesComiteChange}

					<lightning-button
						variant="neutral"
						label="Cancelar"
						onclick={closeModalCondiciones}>
					</lightning-button>
					<lightning-button
						variant="brand"
						label="Guardar"
						onclick={handleGuardarCondiciones}
						disabled={disableGuardarCondicionesButton}>
					</lightning-button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>

				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
	<template if:true={showModalReasignacionManual}>
		<section
			role="dialog"
			tabindex="-1"
			aria-modal="true"
			aria-labelledby="reasignacion-manual-title"
			class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<h2
						id="reasignacion-manual-title"
						class="slds-text-heading_medium">
						Reasignar responsable
					</h2>
				</header>
				<div class="slds-modal__content slds-p-around_medium">
					<lightning-combobox
						data-usuario-manual
						label="Usuario de la cola"
						value={usuarioManualSeleccionado}
						options={usuariosManuales}
						onchange={handleUsuarioManualChange}
						required
						disabled={loading}></lightning-combobox>
				</div>
				<footer class="slds-modal__footer">
					<lightning-button
						label="Cancelar"
						onclick={closeModalReasignacionManual}
						disabled={loading}></lightning-button>
					<lightning-button
						class="slds-m-left_small"
						variant="brand"
						label="Guardar"
						onclick={handleGuardarReasignacionManual}
						disabled={loading}></lightning-button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
	<template if:true={showModalPedidoDocumentacion}>
		<section
			role="dialog"
			tabindex="-1"
			aria-modal="true"
			aria-labelledby="pedido-documentacion-title"
			class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<h2
						id="pedido-documentacion-title"
						class="slds-text-heading_medium">
						Solicitar más documentación
					</h2>
				</header>
				<div class="slds-modal__content slds-p-around_medium">
					<lightning-textarea
						data-pedido-documentacion
						label="Documentación requerida"
						value={pedidoDocumentacionInput}
						onchange={handlePedidoDocumentacionChange}
						maxlength="500"
						required
						disabled={loading}></lightning-textarea>
					<p class="slds-text-body_small slds-m-top_small">
						Máximo 500 caracteres por pedido. Se agrega a los anteriores, hasta 2.000 caracteres en total.
					</p>
				</div>
				<footer class="slds-modal__footer">
					<lightning-button
						label="Cancelar"
						onclick={closeModalPedidoDocumentacion}
						disabled={loading}></lightning-button>
					<lightning-button
						class="slds-m-left_small"
						variant="brand"
						label="Solicitar documentación"
						onclick={handleSolicitarDocumentacionContratos}
						disabled={loading}></lightning-button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>
</template>
