<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="legal-editor-heading" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container modalContainer">
            <header class="slds-modal__header">
                <h2 id="legal-editor-heading" class="slds-text-heading_medium">{modalTitle}</h2>
                <p class="slds-m-top_x-small">Edite el texto de cada bloque. Las imágenes y el diseño del PDF se conservan.</p>
            </header>
            <div class="slds-modal__content modalContent">
                <template if:true={busy}>
                    <lightning-spinner alternative-text="Procesando documento"></lightning-spinner>
                </template>
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">{errorMessage}</div>
                </template>
                <template for:each={sections} for:item="section">
                    <section key={section.key} class="textSection">
                        <h3 class="sectionLabel">{section.label}</h3>
                        <template for:each={section.blocks} for:item="block">
                            <textarea key={block.key} data-key={block.key} aria-label={block.label} rows={block.rows}
                                maxlength="20000" disabled={busy} oninput={handleChange} class="slds-textarea textBlock">{block.text}</textarea>
                        </template>
                    </section>
                </template>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Cancelar" disabled={busy} onclick={handleCancel}></lightning-button>
                <lightning-button class="slds-m-left_small" variant="brand" label="Guardar" disabled={disableSave} onclick={handleSave}></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
